name: iOS
on:
  push:
  pull_request:
jobs:
  verify:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify generated contract and localizations
        run: |
          python3 scripts/generate-contract.py --check
          python3 scripts/check-localizations.py
      - name: Test native boundary
        run: swift test --package-path Packages/MagiCore
      - name: Test iOS screens
        run: scripts/test-ui.sh
